name: Build SPECTER LOCATE

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "HTTPS API base URL"
        required: false
        default: ""
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: server/package.json
      - name: Install server dependencies
        working-directory: server
        run: npm install
      - name: Typecheck and build server
        working-directory: server
        run: npm run build

  android:
    runs-on: ubuntu-latest
    needs: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build both debug APKs
        env:
          INPUT_API_URL: ${{ github.event.inputs.api_url }}
          REPO_API_URL: ${{ vars.SPECTER_API_URL }}
        run: |
          API_URL="${INPUT_API_URL:-${REPO_API_URL}}"
          if [ -n "$API_URL" ]; then
            gradle --no-daemon -PSPECTER_API_URL="$API_URL" :app:assembleDebug :admin:assembleDebug
          else
            gradle --no-daemon :app:assembleDebug :admin:assembleDebug
          fi
      - name: Upload User APK
        uses: actions/upload-artifact@v4
        with:
          name: specter-locate-user-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: specter-locate-admin-debug-apk
          path: admin/build/outputs/apk/debug/*.apk
          if-no-files-found: error
